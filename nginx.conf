worker_processes auto;

events { 
    worker_connections 1024; 
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Kompresi otomatis
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    server {
        listen 8000;  # Port yang dibuka DevTunnel (8000 diteruskan via docker compose)

        # Static files — langsung dari disk, tidak lewat Django
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;  # Cache 1 tahun di browser
            add_header Cache-Control "public, immutable";
        }

        # Media files
        location /media/ {
            alias /app/media/;
            expires 30d;
        }

        # Semua request lain → Gunicorn/Waitress (Django)
        location / {
            proxy_pass http://django:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
