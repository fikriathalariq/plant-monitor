{% extends "admin/change_list.html" %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        /* Limit the height of the changelist table and enable scrolling */
        #changelist .results {
            max-height: 65vh; 
            overflow: auto;
            border-bottom: 2px solid #ddd;
        }

        /* Sticky table headers */
        #changelist .results thead th {
            position: sticky;
            top: 0;
            z-index: 10;
        }
    </style>
{% endblock %}
